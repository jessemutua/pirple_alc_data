<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Limi test labels</title>
<style>
  body { font: 13px system-ui, sans-serif; margin: 24px; color: #111; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.note { color: #555; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .label { margin: 0; border: 1px solid #ddd; border-radius: 8px; padding: 14px; text-align: center; break-inside: avoid; }
  .label img { width: 170px; height: 170px; }
  figcaption { display: grid; gap: 2px; margin-top: 10px; }
  figcaption strong { text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }
  figcaption span { font-size: 12px; }
  figcaption code { font-size: 11px; color: #444; }
  figcaption em { font-size: 11px; color: #666; }
  @media print { .label { border-color: #999; } }
</style>
</head>
<body>
  <h1>Limi test labels</h1>
  <p class="note">
    16 labels. Scan with the Limi app and compare against the expected
    result printed under each code. Print at 100% scale, do not fit to page.
  </p>
  <div class="grid">
      <figure class="label">
        <img src="genuine-KZB5ABHNDQ.svg" alt="genuine label" />
        <figcaption>
          <strong>genuine</strong>
          <span>Kenya Cane Smooth 750ml</span>
          <code>06160000000012</code>
          <code>KZB5ABHNDQ</code>
          <em>expects: verified</em>
        </figcaption>
      </figure>
      <figure class="label">
        <img src="genuine-HRBND6429Y.svg" alt="genuine label" />
        <figcaption>
          <strong>genuine</strong>
          <span>Kenya Cane Smooth 750ml</span>
          <code>06160000000012</code>
          <code>HRBND6429Y</code>
          <em>expects: verified</em>
        </figcaption>
      </figure>
      <figure class="label">
        <img src="genuine-LA9TVZBXC7.svg" alt="genuine label" />

          <strong>genuine</strong>
          <span>Kenya Cane Smooth 750ml</span>
          <code>06160000000012</code>
          <code>LA9TVZBXC7</code>

      </figure>
      <figure class="label">
        <img src="genuine-3Z284EPP4M.svg" alt="genuine label" />
        <figcaption>
          <strong>genuine</strong>
          <span>Kenya Cane Smooth 750ml</span>
          <code>06160000000012</code>
          <code>3Z284EPP4M</code>

      </figure>

        <img src="fabricated-U6NNK54FBU.svg" alt="fabricated label" />
        <figcaption>
          <strong>fabricated</strong>
          <span>Caprice Sweet Red 750ml</span>

      </figure>
      <figure class="label">

      <figure class="label">

  </div>
</body>
