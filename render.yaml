services:
  - type: web
    name: pirple-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_SECRET
        generateValue: true
    databases:
      - name: pirple-db

databases:
  - name: pirple-db
    plan: free
    region: oregon
