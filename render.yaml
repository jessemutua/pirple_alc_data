services:
  - type: web
    name: pirple-backend
    env: python
    plan: free
    region: oregon  # Change to 'frankfurt' or 'singapore' if closer to Kenya
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      API_SECRET:
        generateValue: true  # Render auto-generates a strong secret

databases:
  - name: pirple-db
    plan: free
    region: oregon  # Match the web service region